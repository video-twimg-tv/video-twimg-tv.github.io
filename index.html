<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="7d646d5435ab51c2b6b10ee3f3d61a26b5fe3ceb" content="7d646d5435ab51c2b6b10ee3f3d61a26b5fe3ceb" />
    <title>Videy Viewer – GitHub Pages</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f0f0f; color: white; }
        .container { max-width: 900px; margin: 0 auto; padding: 1rem; }
        video { width: 100%; max-height: 85vh; background: black; }
        .btn-share {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: #1f2937;
            color: white;
            border-radius: 9999px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-share:hover { background: #374151; transform: translateY(-1px); }
    </style>
</head>
<body class="bg-black text-white">

    <div class="container mx-auto py-6 px-4">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold">Videy Viewer</h1>
            <a href="https://videy.co" target="_blank" class="text-blue-400 hover:underline">Videy.co</a>
        </header>

        <div class="bg-black rounded-xl overflow-hidden shadow-2xl mb-6">
            <video
                id="video"
                class="w-full"
                controls
                autoplay
                playsinline
                controlsList="nodownload"
            ></video>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <button id="shareBtn" class="btn-share">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
                    <polyline points="16 6 12 2 8 6"/>
                    <line x1="12" x2="12" y1="2" y2="15"/>
                </svg>
                Share Link
            </button>
        </div>

        <p class="text-center text-gray-400 mt-8 text-sm">
            Video di-load langsung dari server asli • GitHub Pages hanya sebagai viewer
        </p>
    </div>

    <script>
        const params = new URLSearchParams(location.search);
        const id = params.get("id");

        if (!id) {
            document.body.innerHTML = '<div class="text-center mt-20 text-2xl">Masukkan ?id=XXXX di URL<br>Contoh: ?id=NDtJIRbb1</div>';
            throw new Error("ID missing");
        }

        const video = document.getElementById("video");
        const base = "https://cdn.videy.co/" + id;

        // Coba mp4 dulu, fallback ke mov
        video.src = base + ".mp4";
        video.onerror = () => {
            if (!video.dataset.triedAlt) {
                video.dataset.triedAlt = "1";
                video.src = base + ".mov";
            } else {
                video.innerHTML = '<p class="text-center p-10">Video tidak tersedia atau diblokir</p>';
            }
        };

        // Share button
        document.getElementById("shareBtn").onclick = () => {
            const url = location.href;
            if (navigator.share) {
                navigator.share({
                    title: "Videy Video " + id,
                    url: url
                }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => {
                    alert("Link disalin ke clipboard!");
                }).catch(() => {
                    prompt("Copy link ini:", url);
                });
            } else {
                prompt("Copy link ini:", url);
            }
        };

        document.title = "Videy – " + id;
    </script>

</body>
</html>
