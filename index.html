    <title>Videy – Simple Video Viewer</title>

    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f0f0f; color: white; }
        .container { max-width: 900px; margin: 0 auto; padding: 1rem; }
        video { width: 100%; max-height: 85vh; background: black; }
        .btn-upload {
            padding: 0.6rem 1.4rem;
            background: #111827;
            color: white;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .btn-upload:hover { background: #1f2937; }
        .btn-share {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.8rem;
            background: #1f2937;
            color: white;
            border-radius: 9999px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-share:hover { background: #374151; transform: translateY(-1px); }

<body class="bg-black text-white min-h-screen">

    <div class="container mx-auto py-6 px-4">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold tracking-tight">Videy</h1>
            <a href="https://videy.co" target="_blank" class="btn-upload">
                Upload
            </a>
        </header>

        <div class="bg-black rounded-xl overflow-hidden shadow-2xl mb-8">
            <video
                id="video"
                class="w-full"
                controls
                autoplay
                playsinline
                controlsList="nodownload"
            ></video>
        </div>

        <div class="flex justify-center mb-6">
            <button id="shareBtn" class="btn-share">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                    <polyline points="16 6 12 2 8 6"/>
                    <line x1="12" x2="12" y1="2" y2="15"/>
                </svg>
                Share Link
            </button>
        </div>

        <p class="text-center text-gray-500 text-sm mt-4">
        </p>
    </div>

        const params = new URLSearchParams(location.search);
        const id = params.get("id");

        if (!id) {
            document.body.innerHTML = '<div class="text-center mt-20 text-2xl">Tambahkan ?id=XXXX di URL<br>Contoh: ?id=NDtJIRbb1</div>';
            throw new Error("ID missing");
        }

        const video = document.getElementById("video");
        const base = "https://cdn.videy.co/" + id;

        video.src = base + ".mp4";
        video.onerror = () => {
            if (!video.dataset.triedAlt) {
                video.dataset.triedAlt = "1";
                video.src = base + ".mov";
            } else {
                video.innerHTML = '<p class="text-center p-10 text-gray-400">Video tidak tersedia atau gagal dimuat</p>';
            }
        };

        // Share button functionality
        document.getElementById("shareBtn").onclick = () => {
            const url = location.href;
            if (navigator.share) {
                navigator.share({
                    title: "Videy Video " + id,
                    url: url
                }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => {
                    alert("Link berhasil disalin!");
                }).catch(() => {
                    prompt("Salin link ini:", url);
                });
            } else {
                prompt("Salin link ini:", url);
            }
        };

        document.title = "Videy – " + id;
